name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Wildcard dependencies resolve against the dsh host packages; peers are
      # provided by the host at runtime, and plain `npm install` hits ERESOLVE
      # across mismatched prerelease trains — install leniently.
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Закоммиченный бандл обязан совпадать со свежей сборкой: если этот
      # шаг падает — кто-то забыл пересобрать lib/index.js перед пушем.
      - name: Verify committed bundle
        run: git diff --exit-code lib/index.js
      # Текстовые файлы обязаны быть чистым UTF-8: без символов замены и
      # маркеров латиничной кракозябры. Бережёт от аварий кодировки редактора.
      - name: Encoding sanity
        run: node scripts/check-encoding.cjs
